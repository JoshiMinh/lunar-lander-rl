name: Automated Training & Sync

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'models/**'
      - 'README.md'
      - 'walkthrough.md'
      - 'implementation_plan.md'
  workflow_dispatch: # Allow manual trigger
    inputs:
      reset:
        description: 'Reset training and start from scratch'
        required: false
        type: boolean
        default: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y swig

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check Model Status
      run: |
        if [ -f "models/d3qn_model.pth" ]; then
          echo "📦 Model Status: FOUND"
          if [ -f "models/training_log.csv" ]; then
            LAST_EPISODE=$(tail -n 1 models/training_log.csv | cut -d',' -f1)
            echo "   Last Episode: $LAST_EPISODE (resuming training)"
          else
            echo "   Warning: No training log found"
          fi
        else
          echo "🆕 Model Status: NOT FOUND (starting fresh)"
        fi

    - name: Run Training
      run: |
        python -c "from src.train.trainer import train_variant; train_variant('d3qn', n_episodes=3000, max_time=21600, reset=${{ github.event.inputs.reset == 'true' && 'True' || 'False' }})"

    - name: Commit & Push Progress
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "model: auto-update trained weights [skip ci]"
        file_pattern: 'models/d3qn_model.pth models/training_log.csv models/*_model.pth models/*_scores.npy'
        skip_dirty_check: false    
        skip_fetch: true          
        add_options: '--ignore-missing'
